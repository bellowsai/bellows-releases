# Source of truth for .github/workflows/build-unix.yml in bellowsai/bellows-releases.
#
# It is kept here, outside .github/workflows, so this private repository has the
# history of it without GitHub ever running it from here. Change it here, then
# copy it over (HANDOVER.md has the command).
#
# ---------------------------------------------------------------------------
#
# Builds Bellows for macOS and Linux and attaches the installers to a release.
#
# WHY IT LIVES IN THE PUBLIC RELEASES REPOSITORY. GitHub-hosted runners are free
# for public repositories. The private source repository gets 2,000 minutes a
# month, macOS spends them about ten times faster, and running every platform on
# every push used September's allowance up by the 14th, which blocked the 1.10.6
# macOS and Linux builds.
#
# WHAT IS PUBLIC. This file and the build logs. The source is checked out with a
# read-only token and never printed; GitHub masks secrets in logs. Nothing below
# echoes environment variables or file contents.
#
# WHEN IT RUNS. When a release is published -- `npm run release:publish`
# publishes with a personal token, so the `release` event fires -- or by hand,
# with a version. Forks can trigger neither, so neither secret is ever handed to
# anyone else's code.
#
# SECRETS ON bellowsai/bellows-releases:
#   SOURCE_TOKEN        fine-grained token, bellowsai/bellows only, Contents: read-only
#   UPDATE_SIGNING_KEY  the PEM text of ~/.bellows/update-key.pem
#
#   MAC_CERT_P12        base64 of the Developer ID Application .p12
#   MAC_CERT_PASSWORD   its password
#   APPLE_API_KEY_P8    text of the App Store Connect API key (.p8), for notarising
#   APPLE_API_KEY_ID    that key's ID
#   APPLE_API_ISSUER    its issuer ID
#
# The macOS build is Developer ID signed, notarised and Apple Silicon only (see
# electron-builder.json and docs/RELEASING.md). Uploads use this repository's
# own GITHUB_TOKEN.
name: build-unix

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: The released version to build, for example 1.10.6
        required: true

permissions:
  contents: write

concurrency:
  group: build-unix-${{ inputs.version || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            manifest: latest-mac.yml
          - os: ubuntu-latest
            platform: linux
            manifest: latest-linux.yml
    runs-on: ${{ matrix.os }}
    env:
      REQUESTED: ${{ inputs.version || github.event.release.tag_name }}
    steps:
      # First, and in plain words: is the source token usable? An empty secret
      # made gh report "set the GH_TOKEN environment variable", and a wrong one
      # "Bad credentials" -- both deep inside a later step. Only the length is
      # printed, never the value.
      - name: The source token works
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo "::error::SOURCE_TOKEN is empty on this repository. Set it under Settings > Secrets and variables > Actions: a fine-grained token owned by bellowsai, for bellowsai/bellows, Contents read-only."
            exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $SOURCE_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/bellowsai/bellows)
          case "$code" in
            200) echo "SOURCE_TOKEN (${#SOURCE_TOKEN} characters) can read bellowsai/bellows" ;;
            401) echo "::error::SOURCE_TOKEN (${#SOURCE_TOKEN} characters) is not a valid token (HTTP 401): it was mistyped, revoked or expired."; exit 1 ;;
            403|404) echo "::error::SOURCE_TOKEN is a valid token but cannot see bellowsai/bellows (HTTP $code): check it is owned by bellowsai and has that repository selected, Contents read-only."; exit 1 ;;
            *) echo "::error::checking SOURCE_TOKEN returned HTTP $code"; exit 1 ;;
          esac

      - name: Which version
        id: v
        run: |
          v="${REQUESTED#v}"
          case "$v" in ""|*[!0-9.]*) echo "not a version: '$REQUESTED'"; exit 1 ;; esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      # The source repository carries no tags -- electron-builder tags this
      # repository -- so the release is found by the commit `npm run ship`
      # made for it, and exactly that commit is built.
      - name: Find the release commit in the source
        id: src
        env:
          GH_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: |
          sha=$(gh api "repos/bellowsai/bellows/commits?sha=main&per_page=100" \
            --jq '[.[] | select((.commit.message | split("\n")[0]) == "chore: release ${{ steps.v.outputs.version }}")][0].sha // empty')
          if [ -z "$sha" ]; then echo "no 'chore: release ${{ steps.v.outputs.version }}' commit in the last 100 on main"; exit 1; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "building source commit ${sha:0:7}"

      - uses: actions/checkout@v7
        with:
          repository: bellowsai/bellows
          ref: ${{ steps.src.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: source
          persist-credentials: false

      - name: The release exists and matches the source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          got=$(node -p "require('./source/package.json').version")
          if [ "$got" != "${{ steps.v.outputs.version }}" ]; then echo "source commit is version $got, expected ${{ steps.v.outputs.version }}"; exit 1; fi
          draft=$(gh release view "${{ steps.v.outputs.tag }}" --repo "${{ github.repository }}" --json isDraft --jq '.isDraft')
          if [ "$draft" != "false" ]; then echo "${{ steps.v.outputs.tag }} is not a published release"; exit 1; fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install
        working-directory: source
        run: npm ci

      - name: Tests
        working-directory: source
        run: npm test

      # macOS: signed with the Developer ID and notarised, so a download opens
      # without "Open Anyway" and an update keeps the app's identity -- ad-hoc
      # builds each had a new one, and macOS asked for the login password to
      # let every update read the app's own keychain item. Refuses to build
      # without the secrets: an unsigned arm64 app does not open at all.
      - name: Signing and notarisation credentials
        if: matrix.platform == 'mac'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=""
          for n in MAC_CERT_P12 MAC_CERT_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!n}" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets on this repository:$missing. See docs/RELEASING.md, 'macOS signing'."
            exit 1
          fi
          # Secrets piped from files can carry a trailing newline; $GITHUB_ENV
          # takes one line per variable.
          MAC_CERT_PASSWORD=$(printf '%s' "$MAC_CERT_PASSWORD" | tr -d '\r\n')
          APPLE_API_KEY_ID=$(printf '%s' "$APPLE_API_KEY_ID" | tr -d '\r\n ')
          APPLE_API_ISSUER=$(printf '%s' "$APPLE_API_ISSUER" | tr -d '\r\n ')
          MAC_CERT_P12=$(printf '%s' "$MAC_CERT_P12" | tr -d '\r\n ')
          key="$RUNNER_TEMP/apple-api-key.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"

          # The keychain is made here rather than by electron-builder (CSC_LINK):
          # 26.15.3 passes the .p12 password to `set-key-partition-list -k`,
          # which wants the keychain's, so its own keychain never unlocks.
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpw=$(openssl rand -hex 24)
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          p12="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$MAC_CERT_P12" | base64 --decode > "$p12"
          security import "$p12" -k "$kc" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          # electron-builder wants the name without its "Developer ID Application: " prefix.
          name=$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"Developer ID Application: \(.*\)"/\1/p' | head -1)
          if [ -z "$name" ]; then
            echo "::error::no Developer ID Application identity in MAC_CERT_P12"
            security find-identity -v -p codesigning "$kc"
            exit 1
          fi
          echo "signing as: Developer ID Application: $name"
          {
            echo "CSC_KEYCHAIN=$kc"
            echo "CSC_NAME=$name"
            echo "APPLE_API_KEY=$key"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"

      # The runner is Apple silicon, so npm installed only the arm64 Claude
      # binary. The Intel build needs its own; electron-builder.json keeps each
      # build to its own architecture's copy.
      - name: Claude binary for the Intel build
        if: matrix.platform == 'mac'
        working-directory: source
        run: node scripts/sdk-for-arch.js darwin-x64

      - name: Package
        working-directory: source
        run: npm run stamp && npx electron-builder --${{ matrix.platform }} --publish never

      - name: Signed by the Developer ID, notarised, and Gatekeeper opens it
        if: matrix.platform == 'mac'
        working-directory: source
        run: |
          # dist/mac-arm64 is Apple silicon, dist/mac is Intel.
          for dir in mac-arm64:arm64 mac:x86_64; do
            app=$(ls -d dist/${dir%%:*}/*.app | head -1)
            want=${dir##*:}
            echo "== $app"
            codesign --verify --deep --strict "$app"
            codesign -dv "$app" 2>&1 | grep -E '^(Authority|TeamIdentifier)=' | head -3
            if codesign -dv "$app" 2>&1 | grep -q 'Signature=adhoc'; then echo "::error::the app is ad-hoc signed"; exit 1; fi
            xcrun stapler validate "$app"
            spctl --assess --type exec -vv "$app"
            got=$(lipo -archs "$app/Contents/MacOS/Bellows")
            [ "$got" = "$want" ] || { echo "::error::$app is $got, expected $want"; exit 1; }
            # Claude in this copy: the binary for this architecture, and only it.
            sdk=$(ls -d "$app"/Contents/Resources/app.asar.unpacked/node_modules/@anthropic-ai/claude-agent-sdk-darwin-* )
            [ $(echo "$sdk" | wc -l) -eq 1 ] || { echo "::error::$app carries more than one Claude binary: $sdk"; exit 1; }
            got=$(lipo -archs "$sdk/claude")
            [ "$got" = "$want" ] || { echo "::error::$sdk/claude is $got, expected $want"; exit 1; }
          done
          for dmg in dist/*.dmg; do
            spctl --assess --type open --context context:primary-signature -vv "$dmg" || echo "::warning::$dmg itself is not notarised; the app inside is"
          done
          ls dist/*-arm64.dmg dist/*-x64.dmg

      - name: Sign the update manifest
        working-directory: source
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: node scripts/sign-manifest.js dist/${{ matrix.manifest }}

      - name: Attach to the release
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.dmg dist/*-mac.zip dist/*.AppImage dist/*.deb dist/*.blockmap dist/${{ matrix.manifest }} dist/${{ matrix.manifest }}.sig)
          if [ ${#files[@]} -lt 3 ]; then echo "nothing to attach: ${files[*]}"; exit 1; fi
          gh release upload "${{ steps.v.outputs.tag }}" "${files[@]}" --repo "${{ github.repository }}" --clobber

      - name: An installed copy can see it
        run: |
          got=$(curl -fsSL "https://github.com/${{ github.repository }}/releases/download/${{ steps.v.outputs.tag }}/${{ matrix.manifest }}" | sed -n 's/^version: *//p' | tr -d "'\"")
          if [ "$got" != "${{ steps.v.outputs.version }}" ]; then echo "${{ matrix.manifest }} says '$got', expected ${{ steps.v.outputs.version }}"; exit 1; fi
          echo "${{ matrix.manifest }} serves ${{ steps.v.outputs.version }}"
